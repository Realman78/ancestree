<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heirloom — Family Tree</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M12 21V11M12 11a4 4 0 0 1 4-4h3M12 11a4 4 0 0 0-4-4H5"
            fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="12" cy="21" r="1.6" fill="currentColor"/>
      <circle cx="19.5" cy="7" r="1.6" fill="currentColor"/>
      <circle cx="4.5" cy="7" r="1.6" fill="currentColor"/>
    </svg>
    <span>Heirloom</span>
  </div>

  <div class="tree-id">
    <input id="treeTitle" class="tree-title" aria-label="Family tree name" value="Our Family">
    <button id="treeMenuBtn" class="btn tree-menu-btn" aria-haspopup="true" aria-expanded="false"
            title="Your trees">
      <span id="treeCount">1</span>
      <svg viewBox="0 0 10 6" width="9" height="6" aria-hidden="true">
        <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div id="treeMenu" class="tree-menu" hidden>
      <div class="tree-menu-head">Your trees</div>
      <ul id="treeList" class="tree-list"></ul>
      <div class="tree-menu-foot">
        <button class="mini-btn" data-action="newTree">+ New tree</button>
        <button class="mini-btn" data-action="import">Import…</button>
      </div>
      <div class="tree-menu-foot storage-foot">
        <button class="mini-btn" data-action="backupAll">Back up all trees</button>
        <span id="storageUse" class="storage-use"></span>
      </div>
    </div>
  </div>

  <div class="tools">
    <div class="tool-group edit-only">
      <button class="btn" data-action="add" title="Add a person (N)">+ Person</button>
      <button class="btn" data-action="arrange" title="Tidy into generations (A)">Tidy up</button>
    </div>
    <div class="tool-group edit-only">
      <button class="btn with-icon" id="undoBtn" data-action="undo" title="Undo (Ctrl+Z)" disabled>
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M6.5 4.5h3.25a3.25 3.25 0 0 1 0 6.5H5.5" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M8.5 2.25 6 4.5l2.5 2.25" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Undo</span>
      </button>
      <button class="btn icon" id="redoBtn" data-action="redo" title="Redo (Ctrl+Shift+Z)"
              aria-label="Redo" disabled>
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M9.5 4.5H6.25a3.25 3.25 0 0 0 0 6.5H10.5" fill="none"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M7.5 2.25 10 4.5 7.5 6.75" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="tool-group">
      <button class="btn icon" data-action="zoomOut" title="Zoom out" aria-label="Zoom out">&minus;</button>
      <button class="btn zoom-level" id="zoomLevel" data-action="zoomReset"
              title="Reset to 100%">100%</button>
      <button class="btn icon" data-action="fit" title="Fit to screen (F)" aria-label="Fit to screen">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
          <path d="M2 5.5V2.5h3.5M14 5.5V2.5h-3.5M2 10.5v3h3.5M14 10.5v3h-3.5"
                fill="none" stroke="currentColor" stroke-width="1.7"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="btn icon" data-action="zoomIn" title="Zoom in" aria-label="Zoom in">+</button>
    </div>
    <div class="tool-group">
      <button class="btn" data-action="import" title="Open a .json family tree as a new tree">Import</button>
      <div class="menu-wrap">
        <button id="exportBtn" class="btn primary" aria-haspopup="true" aria-expanded="false">
          Export
          <svg viewBox="0 0 10 6" width="9" height="6" aria-hidden="true">
            <path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="exportMenu" class="dropdown" hidden>
          <button data-action="export">
            <strong>JSON</strong><span>The whole tree, re-importable</span>
          </button>
          <button data-action="exportSvg">
            <strong>SVG</strong><span>A vector drawing of the canvas</span>
          </button>
          <button data-action="exportDetailedSvg">
            <strong>Detailed SVG</strong><span>Big portraits, full dates, places
            and known-for</span>
          </button>
          <button data-action="exportPng">
            <strong>PNG</strong><span>The same, as an image</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<main id="stage" class="stage">
  <div id="viewport" class="viewport">
    <svg id="edges" class="edges" aria-hidden="true"></svg>
    <svg id="guides" class="guides" aria-hidden="true"></svg>
    <div id="nodes" class="nodes"></div>
  </div>
</main>

<!-- Floating actions for the selected card -->
<div id="pill" class="pill" hidden>
  <button data-action="parent" title="Add a parent above">+ Parent</button>
  <button data-action="partner" title="Add a partner beside">+ Partner</button>
  <button data-action="child" title="Add a child below">+ Child</button>
  <span class="pill-sep"></span>
  <button data-action="linkPartner" title="Join to an existing person as partners">Link&nbsp;partner</button>
  <button data-action="linkChild" title="Attach an existing person as a child">Link&nbsp;child</button>
  <span class="pill-sep"></span>
  <button data-action="book" title="Open life book (Enter)">Book</button>
  <button data-action="remove" class="danger" title="Remove from tree (Del)">Remove</button>
</div>

<!-- Actions for a selected relationship line -->
<div id="edgePill" class="pill edge-pill" hidden>
  <span class="edge-label" id="edgeLabel"></span>
  <span class="pill-sep"></span>
  <button data-action="removeEdge" class="danger" title="Remove this link (Del)">Remove link</button>
</div>

<div id="hint" class="hint" role="status" aria-live="polite">
  <span id="hintText"></span>
  <button id="hintUndo" class="hint-undo" data-action="undo" hidden>Undo</button>
</div>

<footer class="statusbar">
  <span class="legend"><i class="swatch f"></i>woman <i class="swatch m"></i>man <i class="swatch x"></i>unspecified</span>
  <span class="tips">Drag to move &middot; cards snap to the grid and to each other &middot; drop a photo on a card &middot; Ctrl+scroll to zoom</span>
  <button class="btn small ghost" data-action="demo">Load sample family</button>
</footer>

<!-- ---------------------------------------------------------------- book -->
<div id="bookOverlay" class="book-overlay" hidden>
  <div class="book" role="dialog" aria-modal="true" aria-label="Life book">
    <button id="closeBook" class="close-book" aria-label="Close book">&times;</button>
    <div class="page page-left" id="pageLeft"></div>
    <div class="spine" aria-hidden="true"></div>
    <div class="page page-right" id="pageRight"></div>
  </div>
</div>

<div id="askDialog" class="dialog-overlay" hidden>
  <div class="dialog dialog-narrow" role="alertdialog" aria-modal="true" aria-labelledby="askTitle">
    <h2 id="askTitle"></h2>
    <p id="askBody" class="dialog-sub"></p>
    <div class="dialog-foot dialog-foot-right">
      <button id="askCancel" class="btn ghost">Cancel</button>
      <button id="askOk" class="btn primary">OK</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="js/state.js"></script>
<script src="js/library.js"></script>
<script src="js/photo.js"></script>
<script src="js/layout.js"></script>
<script src="js/tree.js"></script>
<script src="js/book.js"></script>
<script src="js/exchange.js"></script>
<script src="js/main.js"></script>
</body>
</html>
